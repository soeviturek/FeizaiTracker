name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FeizaiTracker.sln --nologo

      - name: Test
        run: dotnet test FeizaiTracker.sln -c Release --no-restore --nologo

      - name: Publish portable app
        run: >
          dotnet publish src\FeizaiTracker.App\FeizaiTracker.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --nologo
          -o dist\FeizaiTracker-win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Include notices
        shell: pwsh
        run: Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination dist\FeizaiTracker-win-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeizaiTracker-win-x64
          path: dist\FeizaiTracker-win-x64
          if-no-files-found: error

