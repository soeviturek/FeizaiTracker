name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build release archive
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\build-release.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem dist\FeizaiTracker-v*-win-x64.zip | Select-Object -First 1
          $tag = '${{ github.ref_name }}'
          if (gh release view $tag 2>$null) {
            gh release upload $tag $archive.FullName "$($archive.FullName).sha256" --clobber
          } else {
            gh release create $tag $archive.FullName "$($archive.FullName).sha256" --generate-notes --verify-tag
          }
